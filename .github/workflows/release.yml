name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: |
          npm install
          npm ci --prefix ui
      - name: Test core
        run: cargo test -p arcadia-core -p arcadia-audio
      # On failure, the end of the output becomes one annotation, so it can
      # be read without the full log.
      - name: Check the app
        shell: pwsh
        run: |
          function Check($name, [scriptblock]$cmd) {
            $out = & $cmd 2>&1 | Out-String
            Write-Output $out
            if ($LASTEXITCODE -ne 0) {
              $tail = ($out -split "`r?`n" | Select-Object -Last 60) -join '%0A'
              Write-Output "::error title=$name failed::$tail"
              exit 1
            }
          }
          Check "UI build" { npm run build --prefix ui }
          Check "cargo check" { cargo check -p arcadia --message-format short }
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Tags make a draft release; a manual run on a branch only builds.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Arcadia ${{ github.ref_name }}
          releaseDraft: true
      - name: Keep the installer from a test build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Arcadia-installer-${{ github.ref_name }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
