[package]
name = "arcadia-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Arcadia's native audio engine: gapless decoding, resampling and output"

[dependencies]
anyhow = "1"
log = "0.4"
parking_lot = "0.12"
crossbeam-channel = "0.5"
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "aac", "isomp4", "alac", "flac", "pcm", "wav", "vorbis", "ogg", "adpcm"] }
rubato = "0.16"
cpal = "0.15"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
